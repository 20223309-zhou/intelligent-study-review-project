spring:
  ai:
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000
  profiles:
    active: dev
  application:
    name: intelligent-study-review
server:
  port: 8233
  servlet:
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000
    context-path: /api
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.zhou.review.controller
# knife4j 配置
knife4j:
  enable: true
  setting:
    language: zh_cn

# mybatis-plus 配置
mybatis-plus:
  configuration:
    # 下划线转驼峰
    map-underscore-to-camel-case: false
  global-config:
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除字段名(deleted为实体类属性名称)
      logic-delete-value: 1 # 逻辑已删除值。可选，默认值为 1
      logic-not-delete-value: 0 # 逻辑未删除值。可选，默认值为 0
logging:
  level:
    org:
      springframework:
        ai:
          chat:
            client:
              advisor: debug